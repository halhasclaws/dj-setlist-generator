name: catalogue-rerun

# D06: re-process published public sets with the current pipeline. Keeps a
# small queue topped up (worst recognition first); the normal dispatcher admits
# runs at PROCESS_SET_MAX_ACTIVE_RUNS. 'run' loops ~5.5 h, then re-dispatches
# itself until the catalogue is done. Logs carry counts only.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: pilot (queue up to limit once), run (continuous), status
        required: true
        default: status
        type: choice
        options: [status, pilot, run]
      limit:
        description: Max sets queued per top-up
        default: '10'
      deployment_target:
        description: Database target
        required: true
        default: production
        type: choice
        options: [production, development]

concurrency:
  group: catalogue-rerun-${{ github.event.inputs.mode == 'status' && 'status' || 'work' }}-${{ github.event.inputs.deployment_target }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write
  id-token: write

jobs:
  rerun:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      DATABASE_URL_DIRECT: ${{ secrets[(github.event.inputs.deployment_target == 'production') && 'PRODUCTION_DATABASE_URL_DIRECT' || 'DEVELOPMENT_DATABASE_URL_DIRECT'] }}
      APP_BASE_URL: ${{ secrets[(github.event.inputs.deployment_target == 'production') && 'PRODUCTION_APP_BASE_URL' || 'DEVELOPMENT_APP_BASE_URL'] }}
      INTERNAL_WORKER_SHARED_SECRET: ${{ secrets[(github.event.inputs.deployment_target == 'production') && 'INTERNAL_WORKER_SHARED_SECRET' || 'DEVELOPMENT_INTERNAL_WORKER_SHARED_SECRET'] }}
      WORKER_DEPLOYMENT_TARGET: ${{ (github.event.inputs.deployment_target == 'production') && 'production' || 'development' }}
      WORKER_EXPECTED_PREVIEW_ORIGIN: https://dj-setlist-generator-git-preview-russell-algeos-projects.vercel.app
      WORKER_VERCEL_OIDC_AUDIENCE: ${{ !(github.event.inputs.deployment_target == 'production') && format('https://github.com/{0}', github.repository_owner) || '' }}
      RERUN_LIMIT: ${{ github.event.inputs.limit }}
      RERUN_QUEUE_TARGET: ${{ github.event.inputs.mode == 'pilot' && github.event.inputs.limit || '20' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-base.txt 'requests>=2.31.0'
      - name: Status
        if: ${{ github.event.inputs.mode == 'status' }}
        run: python -m worker.jobs.catalogue_rerun status
      - name: Pilot top-up
        if: ${{ github.event.inputs.mode == 'pilot' }}
        run: python -m worker.jobs.catalogue_rerun topup
      - id: loop
        name: Continuous top-up
        if: ${{ github.event.inputs.mode == 'run' }}
        run: |
          set +e
          python -m worker.jobs.catalogue_rerun loop
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          [ "$code" = 0 ] || [ "$code" = 3 ]
      - name: Continue in a fresh run
        if: ${{ github.event.inputs.mode == 'run' && steps.loop.outputs.code == '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run catalogue-rerun.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}" -f mode=run -f limit="${{ github.event.inputs.limit }}" -f deployment_target="${{ github.event.inputs.deployment_target }}"
