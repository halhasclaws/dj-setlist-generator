name: n04-train

# N04 audio-learned-v2b: rebuild the Nov 13 training set from Production
# (read only), compute features, train, and check against the 115 stored v2b
# Unknown entries. Logs carry counts only; set data move as sealed artifacts.
on:
  push:
    branches: [preview]
    paths: [.github/n04-train-request.json]

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  export:
    if: ${{ github.repository == 'russell-algeo/dj-setlist-generator' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sets: ${{ steps.export.outputs.sets }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-base.txt
      - id: export
        env:
          DATABASE_URL_DIRECT: ${{ secrets.PRODUCTION_DATABASE_URL_DIRECT }}
          SAMPLING_SOURCE_LINKS: ${{ secrets.SAMPLING_SOURCE_LINKS }}
          EXPORT_OUTPUT: ${{ runner.temp }}/export.bin
        run: python -m worker.jobs.n04_train export >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: n04-export
          path: ${{ runner.temp }}/export.bin
          retention-days: 5

  features:
    needs: export
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        set: ${{ fromJson(needs.export.outputs.sets) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-boundaries.txt
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Ensure ffmpeg (production script)
        run: ./.github/scripts/ensure-ffmpeg.sh
      - run: python -m pip install -r requirements-bootstrap.txt -r requirements-boundaries.txt
      - name: Prepare YouTube auth
        env:
          YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
          YOUTUBE_USER_AGENT: ${{ secrets.YOUTUBE_USER_AGENT }}
        run: ./.github/scripts/prepare-youtube-auth.sh
      - uses: actions/download-artifact@v4
        with:
          name: n04-export
          path: ${{ runner.temp }}/export
      - name: Features (counts only)
        env:
          SET_ID: ${{ matrix.set }}
          SAMPLING_SOURCE_LINKS: ${{ secrets.SAMPLING_SOURCE_LINKS }}
          EXPORT_INPUT: ${{ runner.temp }}/export/export.bin
          FEAT_OUTPUT: ${{ runner.temp }}/features.bin
        run: python -m worker.jobs.n04_train features
      - uses: actions/upload-artifact@v4
        with:
          name: features-${{ matrix.set }}
          path: ${{ runner.temp }}/features.bin
          retention-days: 5
          compression-level: 0

  train:
    needs: [export, features]
    if: ${{ !cancelled() && needs.export.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-boundaries.txt
      - run: python -m pip install -r requirements-base.txt -r requirements-boundaries.txt
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/in
      - name: Train and check against stored v2b (counts only)
        env:
          SAMPLING_SOURCE_LINKS: ${{ secrets.SAMPLING_SOURCE_LINKS }}
          EXPORT_INPUT: ${{ runner.temp }}/in/n04-export/export.bin
          FEATURES_DIR: ${{ runner.temp }}/in
          MODEL_OUTPUT: ${{ runner.temp }}/model/boundaries_v2b.joblib
          REPORT_OUTPUT: ${{ runner.temp }}/model/report.bin
        run: python -m worker.jobs.n04_train train
      - uses: actions/upload-artifact@v4
        with:
          name: n04-model
          path: ${{ runner.temp }}/model
          retention-days: 5
